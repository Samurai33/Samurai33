name: Refresh profile

on:
  schedule:
    - cron: "17 9 * * *"   # daily, 06:17 São Paulo
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile.yml", "scripts/**"]

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1) Contribution graph SVG generated in-house (no third-party stats API, no PAT)
      - name: Generate contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            metrics/contributions.svg?palette=github-light
            metrics/contributions-dark.svg?palette=github-dark&color_snake=#2DD4BF

      # 2) "Now shipping" table from the most recently pushed public repos
      - name: Update "Now shipping"
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_shipping.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md metrics/
          if ! git diff --cached --quiet; then
            git commit -m "chore(profile): daily refresh"
            git push
          fi
